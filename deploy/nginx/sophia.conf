# Load inside http {}, with Ubuntu's stock default site disabled.
map $uri $sophia_route {
    default                             page;
    ~^/api/account(?:/|$)                account;
    ~^/api/progress(?:/|$)               progress;
    ~^/api/philosopher-chat(?:/|$)       chat;
    ~^/api/reader(?:/|$)                 reader;
    /_next/image                        image;
    ~^/_next/static/                    static;
    ~^/(verify-email|reset-password)/?$ sensitive;
}

map $sophia_route $sophia_api_client {
    default  "";
    account  $binary_remote_addr;
    progress $binary_remote_addr;
}
map $sophia_route $sophia_api_server {
    default  "";
    account  account;
    progress progress;
}
map $sophia_route $sophia_image_client {
    default "";
    image   $binary_remote_addr;
}
map $sophia_route $sophia_image_server {
    default "";
    image   image;
}
map "$status:$sophia_route" $sophia_cache_control {
    default "private, no-store";
    ~^(200|206|304):(static|image|reader)$ $upstream_http_cache_control;
}
map $status $sophia_retry_after {
    default "";
    429     5;
}
map $upstream_http_retry_after $sophia_response_retry_after {
    default $upstream_http_retry_after;
    ""      $sophia_retry_after;
}
map $request_method $sophia_method {
    default other;
    GET     GET;
    HEAD    HEAD;
    POST    POST;
    OPTIONS OPTIONS;
}

limit_req_zone $binary_remote_addr zone=sophia_client_rps:10m rate=25r/s;
limit_req_zone $server_name zone=sophia_site_rps:1m rate=150r/s;
limit_req_zone $sophia_api_client zone=sophia_api_client_rps:10m rate=5r/s;
limit_req_zone $sophia_api_server zone=sophia_api_rps:1m rate=20r/s;
limit_req_zone $sophia_image_client zone=sophia_image_client_rps:10m rate=4r/s;
limit_req_zone $sophia_image_server zone=sophia_image_rps:1m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=sophia_client_conn:10m;
limit_conn_zone $server_name zone=sophia_site_conn:1m;
limit_conn_zone $sophia_api_server zone=sophia_api_conn:1m;
limit_conn_zone $sophia_image_server zone=sophia_image_conn:1m;
limit_req_status 429;
limit_conn_status 429;

log_format sophia_min '$time_iso8601 $sophia_method $sophia_route $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name sophialearn.ru;
    access_log /var/log/nginx/sophia.access.log sophia_min;
    error_log /dev/null crit;

    limit_conn sophia_client_conn 16;
    limit_conn sophia_site_conn 96;
    limit_req zone=sophia_client_rps burst=50 nodelay;
    limit_req zone=sophia_site_rps burst=120 nodelay;
    client_header_timeout 5s;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://sophialearn.ru$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null crit;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sophialearn.ru;
    ssl_certificate /etc/letsencrypt/live/sophialearn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sophialearn.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/sophia.access.log sophia_min;
    # Nginx error messages can include the original unredacted request line.
    error_log /dev/null crit;
    server_tokens off;

    client_header_timeout 5s;
    client_body_timeout 5s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    keepalive_timeout 15s;
    keepalive_requests 100;
    send_timeout 15s;
    reset_timedout_connection on;

    limit_conn sophia_client_conn 16;
    limit_conn sophia_site_conn 96;
    limit_conn sophia_api_conn 16;
    limit_conn sophia_image_conn 8;
    limit_req zone=sophia_client_rps burst=50 nodelay;
    limit_req zone=sophia_site_rps burst=120 nodelay;
    limit_req zone=sophia_api_client_rps burst=10 nodelay;
    limit_req zone=sophia_api_rps burst=16 nodelay;
    limit_req zone=sophia_image_client_rps burst=12 nodelay;
    limit_req zone=sophia_image_rps burst=16 nodelay;

    add_header Cache-Control $sophia_cache_control always;
    add_header Retry-After $sophia_response_retry_after always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable after the TLS and renewal checks in UBUNTU_PRODUCTION.md.
    # add_header Strict-Transport-Security "max-age=86400" always;

    location = /api/philosopher-chat {
        default_type application/json;
        return 503 '{"error":"ИИ-чат временно недоступен."}';
    }
    location = /api/philosopher-chat/ {
        default_type application/json;
        return 503 '{"error":"ИИ-чат временно недоступен."}';
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Retry-After;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Connection "";
        proxy_set_header Host sophialearn.ru;
        proxy_set_header X-Forwarded-Host sophialearn.ru;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Sophia-Client-IP $remote_addr;
        include /etc/nginx/sophia-private/proxy-token.conf;
    }
}
